# 企业级 RAG 知识库系统 - 主配置（全量重写）
# 版本基线: Spring Boot 3.5.8 + Spring AI 1.1.2 + SAA 1.1.2.0

server:
  port: 8080

spring:
  application:
    name: commerce-rag

  # ── 加载 backend/.env（DASHSCOPE_API_KEY 等环境变量；optional 保证文件缺失不阻断启动）──
  config:
    import: optional:file:.env[.properties]

  # ── AI 模型配置（2026-08-18 通道切换：chat 走 OpenAI 兼容端点）──
  ai:
    # Spring AI 通用 provider 选择（控制各自动配置启停）：
    # chat=openai（DashScope chat 自动配置因 havingValue 不匹配而停用，避免双 ChatModel bean）
    # embedding/rerank=dashscope（qwen3.7-text-embedding/qwen3-rerank 原生接口可用，保留 SAA 通道）
    model:
      chat: openai
      embedding: dashscope
      rerank: dashscope
    # DashScope 原生通道：仅保留 embedding/rerank；
    # chat 关闭——qwen3.x 新模型（qwen3.8-max/qwen3.7-flash）原生 text-generation 接口 url error 实锤，
    # 统一走下方 openai 兼容端点（用户裁决：统一使用 OpenAI 协议兼容端口）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        enabled: false
      embedding:
        options:
          model: qwen3.7-text-embedding   # spec §6 官方当前最强（原 text-embedding-v4，维度仍 1024）
      rerank:
        options:
          model: qwen3-rerank
    # OpenAI 兼容通道：base-url 指向 DashScope compatible-mode（OpenAI 协议），
    # Spring AI 自动补 /v1/chat/completions 路径（base-url 不含 /v1，避免重复）
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen3.8-max          # spec §6 主对话旗舰
          temperature: 0.7

  # ── PostgreSQL 数据源 ──
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:commerce_rag}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:rag_pg_2024}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ── Flyway 数据库迁移 ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── 文件上传限制 ──
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ── SMTP 邮件（学员注册验证码）──
  # 凭证一律环境变量注入（A.2.3 禁止明文入库）：MAIL_USERNAME / MAIL_PASSWORD
  # 默认发件通道为网易企业域 SMTP over SSL(465)；超时收敛避免注册请求被慢链路长期占用
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # ── Redis（SSE 流缓冲 + Token 黑名单 + 设备互踢）──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rag_redis_2024}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # ── 异步线程池（通用）──
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: rag-async-

# ── MyBatis-Plus 配置（替代 JPA）──
mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-not-delete-value: "0"
      logic-delete-value: "1"
    # 雪花算法 worker-id/datacenter-id（2026-08-25 §1 拍板：env 配置化静态指定，
    # 多实例部署时每实例注入不同值保证跨实例主键唯一，运维侧负责配分）
    worker-id: ${RAG_SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${RAG_SNOWFLAKE_DATACENTER_ID:1}
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  # XML 映射文件位置（多表/复杂查询）
  mapper-locations: classpath*:mapper/**/*.xml

# ── CORS 跨域配置（与 httpOnly cookie 协同需 allowCredentials=true）──
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:5001}

# ── MinIO 业务文件存储 ──
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:rag_storage}
  secret-key: ${MINIO_SECRET_KEY:rag_storage_2024}
  bucket: ${MINIO_BUCKET:rag-documents}

# ── Milvus 向量数据库配置 ──
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: knowledge_chunks
  # text-embedding-v4 输出维度
  embedding-dim: 1024
  # HNSW 索引参数
  hnsw-m: 16
  hnsw-ef-construction: 200
  hnsw-ef: 64
  # RRF 融合常数（混合检索 dense+sparse 融合参数）
  sparse-bm25-k: 60
  # 启动时自动创建 Collection（幂等，存在则跳过）
  auto-create-collection: true

# ── RAG 检索参数 ──
retrieval:
  # 分数传播：子 85% + 父 15%
  score-propagation-alpha: 0.85
  # 语义 85% + 热度 15%
  hotness-alpha: 0.15
  # 热度衰减半衰期（天）
  half-life-days: 7
  # 默认返回结果数
  default-top-k: 5
  # 预取倍数
  prefetch-multiplier: 4
  # RRF 融合常数 k
  rrf-k: 60
  # rerank 阈值
  rerank-threshold: 0.30
  # S1 spec §3.1：每条重写查询的 Milvus 混合检索预取数量（与注入 Top-N 构成 4x rerank 缓冲）
  prefetch-top-k: 20
  # 性能优化报告 2-3：RetrieveNode 三段远程 IO 并行执行器线程数（P2-3：2→3，三任务各有线程，最重的知识检索不再排队）
  retrieve-node-parallelism: 3
  # sparse（BM25 全文检索）开关：2026-08-26 按维护者官方用法整改后恢复（content 字段 jieba 中文分词 +
  # 服务端 BM25 Function，检索 sparse 路 EmbeddedText 文本）；整改失败回退 = 置 false 还原 dense-only 降级
  sparse-enabled: true

# ── ETL 分块参数 ──
etl:
  max-file-size-mb: 100
  # H-3: embedding 批量调用批次大小（DashScope 一次请求携带多条文本，调用次数 = 分片数/批大小）
  embedding-batch-size: 16
  caption-model: qwen3.7-flash       # VLM 图片描述模型（spec §4.5 两通道独立配置）
  image-min-size-kb: 10              # 图片过滤：小于该大小的图标跳过（spec §4.2）
  executor:
    core-size: 2
    max-size: 4
    queue-capacity: 20
    thread-name-prefix: etl-
  image-executor:                     # P2-2b: 图片 upload+caption 并行池（与 etlPool 隔离防子任务自锁）
    core-size: 2
    max-size: 4
    queue-capacity: 20
    thread-name-prefix: etl-image-
    process-timeout-seconds: 60       # 单图处理超时（超时跳过该图标注，不阻断文档 ETL）
  chunk:
    size: 768                        # TokenTextSplitter chunkSizeTokens
    min-chunk-size-chars: 64         # 过小 chunk 并入前一个的阈值（spec §4.1）
    # 注意：overlap 配置已删除——Spring AI 1.1.2 TokenTextSplitter 无 overlap 参数（见计划决策点 1）
  table:
    rows-per-chunk: 25               # 大表分组名义行数（spec §4.3「每 20~30 行一组」）
    max-rows-per-chunk: 30           # 分组行数硬上限（token 动态调整）
    overlap-rows: 2                  # 相邻子 chunk 间重叠行数（spec §4.3「1~2 行」）
  chunk-insert-batch-size: 500       # P1-4: 分片批量插入分批上限（防超长 SQL）

# ── 对话配置 ──
chat:
  max-history-rounds: 10

# ── 模型配置（全链路模型独立配置）──
model:
  # 主对话模型最大上下文窗口（qwen3.8-max 官方 1M；实际按部署模型调整）
  max-context-tokens: 128000

# ── 上下文窗口管理（CustomSummarizationHook 用）──
context:
  # 压缩目标窗口比例：目标窗口 = model.max-context-tokens × window-ratio（预留安全余量）
  window-ratio: 0.7
  # 压缩触发阈值（0~1），达到压缩目标窗口的此比例时触发历史压缩
  threshold: 0.7
  # 压缩后保留的最近消息条数
  keep-recent: 6
  # 摘要用小模型（qwen3.7-flash；旧 qwen-turbo 已下线）
  summary-model: qwen3.7-flash

# ── SSE 流式 + Worker Queue 配置 ──
stream:
  # 请求队列名称（全局 Redis Stream，Worker 消费）
  request-stream: chat:request
  # Consumer Group 名称
  consumer-group: chat-workers
  # Worker 每轮消费批次大小
  batch-size: 10
  # XREAD BLOCK 超时（毫秒）
  poll-timeout: 2000
  # 响应流 + meta 完成后 TTL（秒）
  response-ttl: 300
  # SSE 心跳间隔（秒）
  heartbeat-interval: 15
  # 内存 ring buffer 大小
  ring-buffer-size: 256

# ── 缓存 TTL 配置（宪法 A.5.4：Spring Cache 缓存区与领域缓存 TTL 同源配置化）──
cache:
  ttl:
    # 课程查询领域缓存（CourseQueryCacheService，perf P2-2 决策窗口：写方失效钩子与此联动）
    course-query: 5m
    # dashboard 统计三缓存区（@Cacheable 注解化，perf P2-3 决策窗口 60 秒兜底）
    dashboard-stats: 60s

# ── Agent 配置（F#1 + F#3）──
rag:
  agent:
    # ModelCallLimitHook runLimit（防单 run 无限迭代）
    run-limit: 15
    model: qwen3.8-max              # 主对话模型名（METADATA 事件 model 字段来源，原硬编码于 Worker）
    # 僵死 ACTIVE run 回收租约（分钟）

  # ── S1 Query Understanding（spec §2.2/§6：独立轻量模型 + 重写上限）──
  query-understanding:
    # QU 独立模型（不复用主对话模型，独立配置 qwen3.7-flash）
    model: qwen3.7-flash
    # 单次签出最大重写查询条数（spec §2.2 上限 3）
    max-queries: 3

  # ── S1 Context Builder（spec §3.2：注入条数配置化，Top-K 仅限系统检索）──
  context-builder:
    # 系统资料注入条数（rerank 分数降序取前 N）
    top-k: 5

  # ── F#3 死循环检测（LoopDetectionProperties）──
  loop-detection:
    # Layer 1: hash 滑动窗口（检测重复内容）
    hash:
      window-size: 20
      warn: 3
      hard-stop: 5
    # Layer 2: per-tool 调用频率计数
    per-tool:
      default:
        warn: 15
        hard-stop: 25
      overrides:
        searchKnowledge:
          warn: 25
          hard-stop: 40
        listCourses:
          warn: 5
          hard-stop: 10

  # ── F#3 Token 预算（TokenBudgetProperties）──
  token-budget:
    max-tokens-per-run: 200000
    warn-ratio: 0.8
    hard-stop-ratio: 1.0

  # ── F#3 置信度（ConfidenceProperties）──
  confidence:
    search-high-threshold: 0.8
    search-medium-threshold: 0.5
    multi-source-min: 2

# ── 认证安全配置（F#4 双 Token + 设备互踢）──
auth:
  # JWT 签名密钥（HS256，至少 256 bits）
  secret: ${JWT_SECRET:commerce-rag-secret-key-2026-must-be-at-least-256-bits-long-for-hs256}
  # BUG-7: JWT 密钥严格模式（默认 false 不拦截，开发可用默认值）——生产设 true 时启动校验
  # JWT_SECRET 已配置且非默认值，否则拒绝启动（防漏配导致可伪造任意身份 Token）
  strict-secret: false
  # AT 有效期（秒，默认 900=15min）
  access-token-expiry: 900
  # RT 有效期（秒，默认 604800=7d）
  refresh-token-expiry: 604800
  # Cookie 名称
  cookie-name: commerce_token
  # Cookie 域名
  cookie-domain: localhost
  # Cookie Secure 标记（生产 HTTPS 必须配 true，防 AT 经 HTTP 明文传输被中间人窃取）
  cookie-secure: false
  # 设备类型枚举（当前仅 WEB_DESKTOP）
  device-types:
    - WEB_DESKTOP
  # B1-4: 过期黑名单自动清理调度间隔（秒，默认 3600=1h）——
  # 定时软删 sys_token_blacklist 中 expires_at < now() 的行（配合 countByJti 的过期过滤），
  # 防止 refresh 旋转/互踢/禁用/登出写入的黑名单行无限增长
  blacklist:
    cleanup-interval-seconds: 3600
  # 默认管理员账户种子（AdminSeedInitializer 启动时幂等写入系统唯一超管）
  # username/display-name 可用 AUTH_ADMIN_SEED_USERNAME / AUTH_ADMIN_SEED_DISPLAY_NAME 覆盖；
  # password 默认 admin123（与 V6 迁移出厂种子一致），生产必须用 AUTH_ADMIN_SEED_PASSWORD 覆盖真实值
  # 或首次登录后立即改密——已管理员自行改密后，启动不再覆盖该密码
  admin-seed:
    username: admin
    password: admin123
    display-name: 系统管理员

# ── 学员邮箱注册（验证码生命周期 / 防爆破阈值 / 邮件文案，详见 RegisterProperties）──
register:
  # 验证码有效期（业务要求 15 分钟失效）
  code-ttl: PT15M
  # 同一邮箱两次发送的最小间隔（防刷信箱）
  resend-interval: PT60S
  # 单个验证码最大连续错误次数（超过即作废验证码，防暴力猜测）
  max-verify-attempts: 5
  # 邮件发件人显示名与主题
  from-name: 问渠学堂
  subject: 【问渠学堂】注册验证码

# ── Worker 线程池（对话执行，与 ETL 独立）──
# L-12: core-size/max-size 为实际生效值（WorkerConfig 直接读取，原"动态计算+fallback"注释无逻辑）
# 队列满时 AbortPolicy 快速失败（M-8：run 回写 ERROR，消息已 ACK，失败可见可手动重试）
worker:
  run-pool:
    core-size: 8
    max-size: 8
    queue-capacity: 100
    thread-name-prefix: chat-worker-
    # M-8: ACTIVE run 巡检超时（分钟）——run 滞留 ACTIVE 会锁死会话（uniq_active_run_per_session），
    # 巡检每 60s 扫描一次，超过该时长未结束的 ACTIVE run 置 ERROR 解锁
    stale-run-timeout-minutes: 10
    # B2-3: 滞留 QUEUED run 回收阈值（分钟）——附件处理窗口内崩溃/优雅停机丢弃排队任务时
    # run 滞留 QUEUED（同样占据会话唯一索引），巡检按 created_at 超过该时长判定滞留并置 ERROR 解锁
    stale-queued-timeout-minutes: 5

logging:
  level:
    com.commerce.rag: INFO
    org.springframework.ai: DEBUG
    io.milvus: WARN

# ── 用户附件（spec §5.2 限额定稿，C 端会话级局部处理）──
attachment:
  image-max-size-mb: 10        # 单张图片上限
  document-max-size-mb: 50     # 单个文档上限
  max-count: 10                # 单次消息附件个数上限
  total-max-size-mb: 100       # 单次消息附件合计上限
  cache-max-size: 100          # Caffeine 附件处理结果缓存条目数（LRU）
  cache-expire-minutes: 30     # 附件处理结果缓存失效时间
  embedding-batch-size: 16     # P2-1: 文档附件批量向量化批大小（与 etl.embedding-batch-size 同范式）
  process-timeout-ms: 60000    # P2-2: 附件并行处理总超时（超时丢弃未完成附件，保留已完成结果）
  executor:                    # P2-2: 附件并行池（下载/图片 caption 并行基底，与 ETL/检索/记忆池隔离）
    core-size: 2
    max-size: 4
    queue-capacity: 20
    thread-name-prefix: attachment-

# ── S1 记忆体系（spec §7.8/§8.3：阈值/权重/预算/曲线全配置化）──
memory:
  extraction:
    model: qwen3.7-flash        # 偏好/记忆提取模型（spec §7.6 独立配置）
    debounce-window-seconds: 30 # run 完成后的防抖窗口，同用户窗口内消息合并
    timeout-ms: 10000           # 提取 LLM 调用超时，超时丢弃本批不重试
    threads: 2                  # 防抖调度线程数（偏好/经历各独立小线程池）
    queue-capacity: 32          # 提取执行器队列容量（有界队列，拒绝即按失败降级丢弃本批）
  preference:
    write-high: 0.75            # write_score 直接写阈值
    observe-low: 0.50           # write_score 观察池阈值
    explicit-update: 0.80       # 单值冲突「直接 UPDATE」的 explicitness 门槛
    promote-min-count: 5        # 观察晋升最低计数
    promote-min-score: 0.75     # 观察晋升最低 write_score
    stability-base: 0.1         # stability 曲线基数（min(1, base+count*step)）
    stability-step: 0.15
    weight-explicitness: 0.4    # write_score = 0.4e + 0.4s + 0.2c
    weight-stability: 0.4
    weight-confidence: 0.2
    token-guaranteed: 500       # 硬偏好保底注入预算
    token-extended: 1500        # 其余偏好按 write_score 降序注入预算
    cache-expire-minutes: 30    # 偏好块冻结缓存失效（防 prefix cache 破坏）
    cache-max-size: 256
    value-synonyms:             # 枚举型 key 的 value 归一化（spec §7.4-②）
      response_language:
        zh: 中文
        chinese: 中文
        简体中文: 中文
        en: 英文
        english: 英文
      response_verbosity:
        brief: 简洁
        short: 简洁
        简短: 简洁
        简单: 简洁
        detailed: 详尽
        详细: 详尽
      explain_depth:
        shallow: 基础
        简单: 基础
        deep: 深入
        深入: 深入
  episodic:
    write-high: 0.70              # memory_score 写入阈值（≥0.7 写入；<0.7 IGNORE 无观察池，spec §8.3）
    weight-explicitness: 0.4      # memory_score = 0.4e + 0.3c + 0.3*(importance*typeWeight)
    weight-confidence: 0.3
    weight-importance: 0.3
    type-weights:                 # typeWeight 系统校正（spec §8.3）
      learning_goal: 1.0
      resolved_question: 0.95
      learning_progress: 0.9
      personal_context: 0.8
    token-budget: 1200            # 注入独立预算（与偏好 500+1500 互不挤占，总≤3200）
    recall-top-k: 5               # 召回返回条数上限
    recall-min-score: 0.30        # 召回最低 COSINE 分数（低于阈值不注入）
    prefetch-top-k: 10            # Milvus 召回预取条数（分数过滤前多取）
    existing-text-limit: 100      # {existing} 注入提取 prompt 的 active 记忆行数上限（防无界膨胀）
